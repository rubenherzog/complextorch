name: tests
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout ComplexTorch
        uses: actions/checkout@v4

      - name: Checkout pinned ComplexBox
        uses: actions/checkout@v4
        with:
          repository: bmilinkovic/complexbox
          ref: 87b5e2cd9bba22ddd978bade6f614da7d6190db2
          path: _external/complexbox

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e ./_external/complexbox
      - run: pytest -q
      - name: Run Layer A parity scripts
        run: |
          python validation/layer_a/run_all.py \
            --output validation/layer_a/results/python-${{ matrix.python-version }}
      - name: Upload Layer A diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-a-python-${{ matrix.python-version }}
          path: validation/layer_a/results/python-${{ matrix.python-version }}
          if-no-files-found: warn
