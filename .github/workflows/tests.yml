name: finalize-selection-review
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/selection-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Merge current main
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
      - name: Apply final contract and documentation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          ss = Path('src/complextorch/selection/selection_state_space.py')
          text = ss.read_text(encoding='utf-8')
          text = text.replace(
              'from .._subspace import _block_hankel, _larimore_decomposition, _resolve_dtype',
              'from .._subspace import _block_hankel, _larimore_decomposition',
              1,
          )
          start = text.index('\ndef _normalise_observations(')
          end = text.index('\ndef _bauer_svc(', start)
          text = text[:start] + text[end:]
          old_call = '''values, _ = _normalise_observations(\n        observations, device=device, dtype=dtype\n    )'''
          new_call = '''values, _ = _normalise_ss_observations(\n        observations, device=device, dtype=dtype\n    )'''
          if old_call not in text:
              raise SystemExit('state-space normalizer call not found')
          text = text.replace(old_call, new_call, 1)
          if text.count('lower = max(n_variables, min(orders))') != 2:
              raise SystemExit('unexpected Bauer diagnostic lower-bound count')
          text = text.replace('lower = max(n_variables, min(orders))', 'lower = min(orders)')
          old_cov = 'covariance: Literal["mle", "unbiased"] = "unbiased"'
          if text.count(old_cov) != 1:
              raise SystemExit('unexpected state-space CV covariance default count')
          text = text.replace(old_cov, 'covariance: Literal["mle", "unbiased"] = "mle"', 1)
          text = text.replace('''        if self.refit:\n            from ..state_space import LarimoreStateSpace\n\n            self.best_estimator_ = LarimoreStateSpace(''', '''        if self.refit:\n            self.best_estimator_ = LarimoreStateSpace(''', 1)
          text = text.replace(
              '    A single Larimore CVA decomposition is computed per fold and shared across\n    all candidate dimensions. Bauer SVC remains a training-only diagnostic.\n',
              '    A single Larimore CVA decomposition is computed per fold and shared across\n    all candidate dimensions. Bauer SVC remains a training-only diagnostic and\n    uses the same candidate state dimensions as the CV search; latent order is\n    not lower-bounded by the observation dimension. Innovation covariance uses\n    maximum-likelihood normalization by default, matching ``LarimoreStateSpace``.\n',
              1,
          )
          ss.write_text(text, encoding='utf-8')

          temporal = Path('src/complextorch/selection/_temporal.py')
          text = temporal.read_text(encoding='utf-8')
          text = text.replace('self.orders = tuple(int(order) for order in orders)', 'self.orders = orders', 1)
          text = text.replace('self.cv = cv or EpochTimeSeriesSplit()', 'self.cv = cv', 1)
          text = text.replace('orders = tuple(sorted(set(self.orders)))', 'orders = tuple(sorted({int(order) for order in self.orders}))', 1)
          old = '''        folds = tuple(\n            self.cv.split(\n                data.shape[1],\n                min_order=self._minimum_training_size(orders),\n            )\n        )'''
          new = '''        splitter = self.cv if self.cv is not None else EpochTimeSeriesSplit()\n        folds = tuple(\n            splitter.split(\n                data.shape[1],\n                min_order=self._minimum_training_size(orders),\n            )\n        )'''
          if old not in text:
              raise SystemExit('temporal splitter block not found')
          text = text.replace(old, new, 1)
          temporal.write_text(text, encoding='utf-8')

          var = Path('src/complextorch/selection/selection_var.py')
          text = var.read_text(encoding='utf-8')
          text = text.replace('self.orders = tuple(int(value) for value in orders)', 'self.orders = orders', 1)
          old = '''        del y\n        if not self.orders or min(self.orders) < 1:\n            raise ValueError("orders must be positive")'''
          new = '''        del y\n        orders = tuple(int(value) for value in self.orders)\n        if not orders or min(orders) < 1:\n            raise ValueError("orders must be positive")'''
          if old not in text:
              raise SystemExit('VAR IC validation block not found')
          text = text.replace(old, new, 1)
          text = text.replace('for order in self.orders:', 'for order in orders:', 1)
          text = text.replace('self.orders[int(np.nanargmin(aic))]', 'orders[int(np.nanargmin(aic))]', 1)
          text = text.replace('self.orders[int(np.nanargmin(bic))]', 'orders[int(np.nanargmin(bic))]', 1)
          text = text.replace('self.orders[int(np.nanargmin(hqc))]', 'orders[int(np.nanargmin(hqc))]', 1)
          text = text.replace('            self.orders,\n        )', '            orders,\n        )', 1)
          text = text.replace(
              '"""MVGC2-compatible in-sample AIC/BIC/HQC order selection."""',
              '''r"""Select VAR lag order with in-sample AIC, BIC, and HQC.\n\n    Each candidate lag :math:`p` is fitted independently, and the Gaussian\n    residual likelihood is combined with the corresponding information-\n    criterion penalty. ``refit`` selects which minimizing criterion determines\n    ``best_order_`` and ``best_estimator_``; it is separate from temporal CV.\n    """''',
              1,
          )
          text = text.replace('''        """Initialize the estimator or result container.\n\n        Parameters''', '''        """Initialize VAR information-criterion selection.\n\n        Parameters''', 1)
          text = text.replace('''        hurvich_tsai\n            Input required by this calculation.''', '''        hurvich_tsai\n            Apply the Hurvich--Tsai small-sample correction to AIC.''', 1)
          text = text.replace('''        refit\n            Input required by this calculation.''', '''        refit\n            Criterion used to choose and expose ``best_estimator_``. One of\n            ``"aic"``, ``"bic"``, ``"hqc"``, or ``None`` to skip refitting.''', 1)
          text = text.replace('''        """Fit fit from observations.''', '''        """Fit every candidate order and compute AIC, BIC, and HQC curves.''', 1)
          text = text.replace('''        object\n            The fitted estimator instance.''', '''        VAROrderSelectionIC\n            Fitted selector with criterion curves and minimizing orders.''', 1)
          var.write_text(text, encoding='utf-8')

          subspace = Path('src/complextorch/_subspace.py')
          text = subspace.read_text(encoding='utf-8')
          old = '''def _larimore_decomposition(past, future, *, ridge):\n    """Return Larimore canonical correlations, right vectors and past factor."""'''
          new = '''def _larimore_decomposition(past, future, *, ridge):\n    r"""Compute the Larimore CVA whitening and singular-value decomposition.\n\n    For past and future block-Hankel matrices :math:`P` and :math:`F`, with\n    :math:`N` columns, form\n\n    .. math::\n\n       \\Sigma_{PP}=PP^\\top/N,\\qquad\n       \\Sigma_{FF}=FF^\\top/N,\\qquad\n       \\Sigma_{FP}=FP^\\top/N.\n\n    If :math:`L_PL_P^\\top=\\Sigma_{PP}+\\lambda I` and\n    :math:`L_FL_F^\\top=\\Sigma_{FF}+\\lambda I`, the canonical correlations\n    are the singular values of\n\n    .. math::\n\n       M=L_F^{-1}\\Sigma_{FP}L_P^{-\\top}.\n\n    ``ridge`` is applied only to the two whitening covariances. The returned\n    right singular vectors and :math:`L_P` are reused to construct Larimore\n    canonical state sequences without explicit matrix inverses.\n\n    References\n    ----------\n    - Larimore, W. E. (1990). Canonical variate analysis in identification,\n      filtering, and adaptive control.\n    - Larimore, W. E. (1996). Statistical optimality and canonical variate\n      analysis system identification.\n    """'''
          if old not in text:
              raise SystemExit('Larimore decomposition docstring anchor not found')
          text = text.replace(old, new, 1)
          subspace.write_text(text, encoding='utf-8')

          test_ss = Path('tests/test_state_space_order_search_cv.py')
          text = test_ss.read_text(encoding='utf-8')
          if 'from types import SimpleNamespace' not in text:
              text = text.replace('import numpy as np\n', 'from types import SimpleNamespace\n\nimport numpy as np\n', 1)
          marker = 'def test_bauer_diagnostics_allow_order_below_observation_dimension():'
          if marker not in text:
              insertion = '''\n\ndef test_bauer_diagnostics_allow_order_below_observation_dimension():\n    \"\"\"CV diagnostics must permit latent order below output dimension.\"\"\"\n\n    search = StateSpaceOrderSearchCV(\n        orders=(1, 2, 3), past_horizon=2, refit=False\n    )\n    search._begin_diagnostics(n_orders=3, n_folds=1)\n    decomposition = SimpleNamespace(\n        values=torch.zeros(1, 20, 3, dtype=torch.float64),\n        correlations=torch.tensor(\n            [[0.44, 0.09, 0.08, 0.07]], dtype=torch.float64\n        ),\n        n_columns=6000,\n        batch=1,\n    )\n    search._fold_diagnostics(\n        {\"decomposition\": decomposition}, (1, 2, 3), fold_index=0\n    )\n    assert np.isfinite(search._bauer_scores[0, 0])\n    assert search._bauer_orders[0] == 1\n\n\ndef test_state_space_cv_defaults_to_mle_innovation_covariance():\n    \"\"\"CV and fixed-order Larimore fitting use the same covariance default.\"\"\"\n\n    assert StateSpaceOrderSearchCV((1,), 2, refit=False).covariance == \"mle\"\n'''
              anchor = '\ndef test_gap_samples_do_not_enter_validation_score_directly():'
              if anchor not in text:
                  raise SystemExit('state-space CV test anchor not found')
              text = text.replace(anchor, insertion + anchor, 1)
          test_ss.write_text(text, encoding='utf-8')

          shared = Path('tests/test_temporal_order_search_shared.py')
          text = shared.read_text(encoding='utf-8')
          if 'from sklearn.base import clone' not in text:
              text = text.replace('import torch\n', 'import torch\nfrom sklearn.base import clone\n', 1)
          marker = 'def test_temporal_search_estimators_are_sklearn_cloneable():'
          if marker not in text:
              insertion = '''\n\ndef test_temporal_search_estimators_are_sklearn_cloneable():\n    \"\"\"Constructors preserve parameters so sklearn cloning is valid.\"\"\"\n\n    orders = [1, 2]\n    cv = EpochTimeSeriesSplit(n_splits=2)\n    var = VAROrderSearchCV(orders, cv=cv, refit=False)\n    state_space = StateSpaceOrderSearchCV(orders, 2, cv=cv, refit=False)\n    assert var.orders is orders\n    assert state_space.orders is orders\n    assert clone(var).get_params()[\"orders\"] == orders\n    assert clone(state_space).get_params()[\"orders\"] == orders\n'''
              anchor = '\ndef test_state_space_reuses_one_cva_decomposition_per_fold(monkeypatch):'
              if anchor not in text:
                  raise SystemExit('shared temporal test anchor not found')
              text = text.replace(anchor, insertion + anchor, 1)
          shared.write_text(text, encoding='utf-8')
          PY
      - name: Validate final tree
        run: |
          ruff check --fix src/complextorch/_subspace.py src/complextorch/selection tests/test_state_space_model_order.py tests/test_state_space_order_search_cv.py tests/test_temporal_order_search_shared.py
          ruff check src/complextorch/_subspace.py src/complextorch/selection tests/test_state_space_model_order.py tests/test_state_space_order_search_cv.py tests/test_temporal_order_search_shared.py
          python -m compileall -q src/complextorch
          pytest -q
      - name: Assert architecture invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('src/complextorch')
          forbidden_paths = [root/'selection.py', root/'var_selection_cv.py', root/'state_space_selection.py', root/'_temporal_order_search.py', root/'_state_space_order.py', root/'_model_comparison.py', root/'_typing.py']
          present = [str(p) for p in forbidden_paths if p.exists()]
          if present:
              raise SystemExit(f'legacy files remain: {present}')
          source = '\n'.join(p.read_text(encoding='utf-8') for p in root.rglob('*.py'))
          forbidden_refs = ['._state_space_order','._temporal_order_search','.var_selection_cv','.state_space_selection','._model_comparison','._typing']
          leftovers = [token for token in forbidden_refs if token in source]
          if leftovers:
              raise SystemExit(f'legacy imports remain: {leftovers}')
          for name in ('VAROrderSearchCV','StateSpaceOrderSearchCV','VAROrderSelectionIC','StateSpaceOrderSelection'):
              count = len(re.findall(rf'^class {name}\b', source, flags=re.M))
              if count != 1:
                  raise SystemExit(f'{name} definitions: {count}')
          count = len(re.findall(r'^def _larimore_decomposition\b', source, flags=re.M))
          if count != 1:
              raise SystemExit(f'_larimore_decomposition definitions: {count}')
          PY
      - name: Commit final tree
        run: |
          git show origin/main:.github/workflows/tests.yml > .github/workflows/tests.yml
          git add -- src/complextorch/_subspace.py src/complextorch/selection/_temporal.py src/complextorch/selection/selection_state_space.py src/complextorch/selection/selection_var.py tests/test_state_space_order_search_cv.py tests/test_temporal_order_search_shared.py .github/workflows/tests.yml
          git diff --cached --check
          git commit -m "Finalize selection architecture contracts"
          git push origin HEAD:refactor/selection-architecture
