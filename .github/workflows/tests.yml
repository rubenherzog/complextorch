name: refactor-final-lint
on:
  push:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/selection-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Remove refactor-introduced lint issues
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/complextorch/measures/mvgc.py': [
                  ('reduce_innovations_state_space, innovations_transfer_function, reduce_state_space',
                   'reduce_innovations_state_space, innovations_transfer_function'),
              ],
              'src/complextorch/selection/_temporal.py': [
                  ('from typing import Iterable, Literal', 'from typing import Literal'),
              ],
              'src/complextorch/selection/selection_state_space.py': [
                  ('from sklearn.base import BaseEstimator\n', ''),
              ],
              'src/complextorch/selection/selection_var.py': [
                  ('from typing import Iterable, Literal', 'from typing import Literal'),
              ],
          }
          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f'expected text not found in {filename}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint refactor-touched files
        run: |
          ruff check \
            src/complextorch/__init__.py \
            src/complextorch/_subspace.py \
            src/complextorch/adapters.py \
            src/complextorch/measures/__init__.py \
            src/complextorch/measures/_nested_var.py \
            src/complextorch/measures/mvgc.py \
            src/complextorch/selection \
            src/complextorch/state_space.py \
            tests/test_state_space_model_order.py \
            tests/test_temporal_order_search_shared.py
      - run: python -m compileall -q src/complextorch
      - run: pytest -q
      - name: Commit lint-clean refactor files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/complextorch/measures/mvgc.py \
            src/complextorch/selection/_temporal.py \
            src/complextorch/selection/selection_state_space.py \
            src/complextorch/selection/selection_var.py
          git diff --cached --check
          git commit -m "Clean refactor lint issues"
          git push origin HEAD:refactor/selection-architecture
