name: tests
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10","3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Apply architecture refactor in CI workspace
        run: |
          python scripts/refactor_selection_architecture.py || true
          python scripts/remove_duplicate_larimore.py
      - name: Audit architecture invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src = Path('src/complextorch')
          forbidden = [
              'selection.py', 'var_selection_cv.py', 'state_space_selection.py',
              '_temporal_order_search.py', '_typing.py', '_model_comparison.py',
              '_state_space_order.py',
          ]
          for name in forbidden:
              if (src / name).exists():
                  raise SystemExit(f'stale architecture file remains: {name}')
          text = '\n'.join(p.read_text(encoding='utf-8') for p in src.rglob('*.py'))
          for token in (
              '._state_space_order', '._temporal_order_search', '.var_selection_cv',
              '.state_space_selection', '._typing', '._model_comparison',
              '_sys.modules', '_selection.VAROrder',
          ):
              if token in text:
                  raise SystemExit(f'stale architecture reference remains: {token}')
          for class_name in (
              'VAROrderSearchCV', 'VAROrderSelectionIC',
              'StateSpaceOrderSearchCV', 'StateSpaceOrderSelection',
          ):
              count = len(re.findall(rf'^class {class_name}\(', text, flags=re.M))
              if count != 1:
                  raise SystemExit(f'expected one exact {class_name} definition, found {count}')
          decomposition_count = len(re.findall(r'^def _larimore_decomposition\(', text, flags=re.M))
          if decomposition_count != 1:
              raise SystemExit(f'expected one _larimore_decomposition definition, found {decomposition_count}')
          required = [
              src / 'selection/__init__.py',
              src / 'selection/selection_var.py',
              src / 'selection/selection_state_space.py',
              src / 'selection/_temporal.py',
              src / 'measures/_nested_var.py',
          ]
          for path in required:
              if not path.exists():
                  raise SystemExit(f'missing required refactor path: {path}')
          PY
      - name: Capture transformed tree
        if: matrix.python-version == '3.12'
        run: |
          git diff --binary > refactor.patch
          tar -czf refactor-tree.tar.gz src tests examples
      - name: Upload transformed tree
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: refactor-selection-tree
          path: |
            refactor.patch
            refactor-tree.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
