name: final-selection-validation
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10","3.11","3.12","3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src/complextorch
      - run: pytest -q
      - name: Lint refactor surface
        if: matrix.python-version == '3.12'
        run: >-
          ruff check
          src/complextorch/__init__.py
          src/complextorch/_subspace.py
          src/complextorch/adapters.py
          src/complextorch/measures/_nested_var.py
          src/complextorch/measures/mvgc.py
          src/complextorch/selection
          src/complextorch/state_space.py
          src/complextorch/var.py
          tests/test_state_space_model_order.py
          tests/test_state_space_order_search_cv.py
          tests/test_temporal_order_search_shared.py
