name: tests
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose duplicate selector definitions
        run: |
          set +e
          python scripts/refactor_selection_architecture.py
          status=$?
          set -e
          echo "refactor exit=$status"
          grep -R -n 'class StateSpaceOrderSelection' src || true
          grep -R -n 'class VAROrderSelectionIC' src || true
          exit $status
