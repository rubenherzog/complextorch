name: tests
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose architecture transform
        run: |
          set +e
          python scripts/refactor_selection_architecture.py
          status=$?
          set -e
          echo "refactor exit=$status"
          echo "--- stale references ---"
          grep -R -n -E '_model_comparison|_state_space_order|_temporal_order_search|var_selection_cv|state_space_selection|_typing' src tests examples || true
          exit $status
