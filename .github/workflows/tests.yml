name: tests
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  finalize-refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/selection-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build final refactor tree
        run: |
          python scripts/refactor_selection_architecture.py || true
          python scripts/remove_duplicate_larimore.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/complextorch/selection/selection_state_space.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'Smallest candidate state dimension. Defaults to the number of observed\n        variables, matching the full-model MVGC convention.',
              'Smallest candidate state dimension. Defaults to one; latent state dimension\n        is not constrained by the number of observed variables.',
          )
          text = text.replace(
              '            from .state_space import LarimoreStateSpace',
              '            from ..state_space import LarimoreStateSpace',
          )
          p.write_text(text, encoding='utf-8')
          for root in (Path('src'), Path('tests'), Path('examples')):
              if not root.exists():
                  continue
              for path in root.rglob('*.py'):
                  lines = path.read_text(encoding='utf-8').splitlines()
                  path.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')
          PY
      - name: Audit architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src = Path('src/complextorch')
          forbidden = [
              'selection.py', 'var_selection_cv.py', 'state_space_selection.py',
              '_temporal_order_search.py', '_typing.py', '_model_comparison.py',
              '_state_space_order.py',
          ]
          for name in forbidden:
              if (src / name).exists():
                  raise SystemExit(f'stale architecture file remains: {name}')
          text = '\n'.join(p.read_text(encoding='utf-8') for p in src.rglob('*.py'))
          for token in (
              '._state_space_order', '._temporal_order_search', '.var_selection_cv',
              '.state_space_selection', '._typing', '._model_comparison',
              '_sys.modules', '_selection.VAROrder',
          ):
              if token in text:
                  raise SystemExit(f'stale architecture reference remains: {token}')
          for class_name in (
              'VAROrderSearchCV', 'VAROrderSelectionIC',
              'StateSpaceOrderSearchCV', 'StateSpaceOrderSelection',
          ):
              count = len(re.findall(rf'^class {class_name}\(', text, flags=re.M))
              if count != 1:
                  raise SystemExit(f'expected one exact {class_name} definition, found {count}')
          if len(re.findall(r'^def _larimore_decomposition\(', text, flags=re.M)) != 1:
              raise SystemExit('Larimore decomposition must have one source of truth')
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - name: Restore normal CI and remove refactor scaffolding
        run: |
          python - <<'PY'
          from pathlib import Path
          expression = '$' + '{{ matrix.python-version }}'
          content = (
              'name: tests\n'
              'on:\n'
              '  push:\n'
              '  pull_request:\n'
              'jobs:\n'
              '  cpu:\n'
              '    runs-on: ubuntu-latest\n'
              '    strategy:\n'
              '      matrix:\n'
              '        python-version: ["3.10","3.12"]\n'
              '    steps:\n'
              '      - uses: actions/checkout@v4\n'
              '      - uses: actions/setup-python@v5\n'
              '        with:\n'
              f'          python-version: {expression}\n'
              '      - run: python -m pip install --upgrade pip\n'
              '      - run: python -m pip install -e ".[dev]"\n'
              '      - run: pytest -q\n'
          )
          Path('.github/workflows/tests.yml').write_text(content, encoding='utf-8')
          PY
          git rm -- scripts/refactor_selection_architecture.py scripts/remove_duplicate_larimore.py .github/workflows/refactor-selection-architecture.yml
      - name: Commit final refactor tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/tests.yml \
            src/complextorch/__init__.py \
            src/complextorch/_subspace.py \
            src/complextorch/adapters.py \
            src/complextorch/measures/__init__.py \
            src/complextorch/measures/_nested_var.py \
            src/complextorch/measures/mvgc.py \
            src/complextorch/selection/__init__.py \
            src/complextorch/selection/_temporal.py \
            src/complextorch/selection/selection_var.py \
            src/complextorch/selection/selection_state_space.py \
            src/complextorch/state_space.py \
            src/complextorch/var.py \
            tests/test_state_space_model_order.py \
            tests/test_temporal_order_search_shared.py
          git add -u -- src/complextorch/_model_comparison.py \
            src/complextorch/_temporal_order_search.py \
            src/complextorch/_typing.py \
            src/complextorch/selection.py \
            src/complextorch/state_space_selection.py \
            src/complextorch/var_selection_cv.py
          git diff --cached --check
          git commit -m "Refactor model-selection architecture"
          git push origin HEAD:refactor/selection-architecture
