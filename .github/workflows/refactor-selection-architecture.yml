name: Refactor selection architecture

on:
  push:
    branches:
      - refactor/selection-architecture

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Apply refactor in working tree
        run: python scripts/refactor_selection_architecture.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile package
        run: python -m compileall -q src/complextorch
      - name: Ruff
        run: ruff check src tests
      - name: Test suite
        run: pytest -q

  commit:
    if: github.actor != 'github-actions[bot]'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply validated refactor
        run: python scripts/refactor_selection_architecture.py
      - name: Remove one-shot automation
        run: rm scripts/refactor_selection_architecture.py .github/workflows/refactor-selection-architecture.yml
      - name: Verify clean patch
        run: git diff --check
      - name: Commit transformed tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- src/complextorch tests examples scripts .github/workflows
          git add -- src/complextorch/selection src/complextorch/measures/_nested_var.py
          git status --short
          git commit -m 'Refactor model-selection architecture'
          git push origin HEAD:refactor/selection-architecture

# one-shot trigger
