name: Publish validated source tree

on:
  push:
    branches: [feat/initial-torch-architecture]
    paths: ['.bootstrap/READY']

permissions:
  contents: write

concurrency:
  group: publish-complextorch-source
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/initial-torch-architecture
          fetch-depth: 0
      - name: Verify and expand validated source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/v0.3.part.* | base64 --decode > /tmp/complextorch-v0.3.0.tar.gz
          echo "484edfd6e068f8764bce107fc77746d129527d6f4448b3c1323cf6d9bb146f52  /tmp/complextorch-v0.3.0.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/complextorch-v0.3.0.tar.gz > /tmp/complextorch-manifest.txt
          tar -xzf /tmp/complextorch-v0.3.0.tar.gz
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Commit the real repository tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r path; do
            git add -- "$path"
          done < /tmp/complextorch-manifest.txt
          git add -u -- .bootstrap .github/workflows/bootstrap.yml README.md
          git diff --cached --check
          git commit -m "Publish validated ComplexTorch 0.3.0 source tree"
          git push origin HEAD:feat/initial-torch-architecture
