name: generate-source-docstrings

on:
  push:
    branches: ["docs/comprehensive-docstrings"]

permissions:
  contents: write

jobs:
  document:
    if: ${{ !contains(github.event.head_commit.message, '[generated-docstrings]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/comprehensive-docstrings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/normalize_scientific_docstrings.py
      - run: python scripts/refine_generated_docstrings.py
      - run: python -m compileall -q src/complextorch
      - name: Commit generated documentation
        run: |
          if git diff --quiet -- src/complextorch; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/complextorch
          git commit -m "Normalize source docstrings [generated-docstrings]"
          git push origin HEAD:docs/comprehensive-docstrings
