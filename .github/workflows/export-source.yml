name: Export source checkout

on:
  pull_request:
    branches:
      - main

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive repository checkout
        run: tar --exclude=.git -czf /tmp/complextorch-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: complextorch-source
          path: /tmp/complextorch-source.tar.gz
