name: Apply internal mathematical comments

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/internal-math-comments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add comments beside scientific computations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, re
          root = Path('src/complextorch')
          notes = {
              'solve_dare': 'Iterate the steady-state Kalman covariance recursion until the Riccati fixed point is reached.',
              'solve_generalized_dare': 'Iterate the generalized Riccati map, including process-observation noise cross covariance.',
              'innovations_form': 'Convert the general state-space model to predictor form using the steady-state innovation covariance and Kalman gain.',
              'var_to_innovations_state_space': 'Embed VAR(p) coefficients in companion form so the observation process is represented exactly in innovations form.',
              'reduce_innovations_state_space': 'Marginalize unobserved channels by solving the reduced innovations problem rather than deleting covariance blocks naively.',
              'innovations_transfer_function': 'Evaluate H(z)=I+C(zI-A)^-1 K, the transfer function from innovations to observations.',
              'dynamical_dependence': 'Measure predictive information lost after projecting the observation process to a lower-dimensional subspace.',
              'stochastic_interaction': 'Compare joint and component innovation volumes; the log-determinant gap quantifies failure of dynamical factorization.',
              'optimise_dynamical_dependence_projection': 'Optimize on the Stiefel manifold so projection columns remain orthonormal throughout the search.',
              'gaussian_entropy': 'Evaluate H(X)=1/2[k log(2 pi e)+log det Sigma] for the selected Gaussian covariance.',
              'gaussian_mutual_information': 'Use I(X;Y)=1/2 log(det Sigma_X det Sigma_Y / det Sigma_XY).',
              'gaussian_conditional_mutual_information': 'Use the Gaussian Schur-complement identity for I(X;Y|Z).',
              'total_correlation': 'Compute total correlation as the sum of marginal entropies minus the joint entropy.',
              'dual_total_correlation': 'Compute dual total correlation from joint entropy and leave-one-out conditional entropies.',
              'o_information': 'Combine total and dual total correlation; the sign distinguishes redundancy- from synergy-dominated dependence.',
              'discrete_entropy': 'Estimate Shannon entropy from empirical symbol probabilities, omitting zero-probability terms.',
              'lempel_ziv_complexity': 'Count new phrases in the LZ76 parsing as a finite-sample proxy for algorithmic complexity.',
              'temporal_mvgc': 'Compare full and reduced innovation covariance volumes to obtain Geweke time-domain Granger causality.',
              'spectral_mvgc': 'Decompose the predictive covariance ratio over frequency using the model transfer function and spectrum.',
              'phiid': 'Build redundancy-lattice terms first, then recover the 16 PhiID atoms by Mobius inversion.',
              '_mobius_inversion': 'Recover each atom by subtracting all lower-order lattice contributions from its redundancy term.',
              'companion_matrix': 'Stack VAR lags into a first-order Markov state whose top block contains the autoregressive coefficients.',
              'build_var_system': 'Derive companion-state covariance and stationary observation quantities from fitted VAR parameters.',
              'random_stable_var': 'Rescale the coefficient companion matrix so its spectral radius is below one and the VAR is stationary.',
              'simulate_var': 'Generate samples from x_t = sum_k A_k x_(t-k) + epsilon_t.',
              'kalman_filter': 'Alternate state prediction and measurement update using the innovation covariance and Kalman gain.',
              'kalman_smoother': 'Run the Rauch-Tung-Striebel backward recursion to condition filtered states on all observations.',
              '_fit_single_n4sid': 'Recover a low-rank state sequence from block-Hankel projections, then regress A and C at fixed state dimension.',
              '_fit_single_larimore': 'Use canonical variates of past and future blocks as state coordinates, then estimate A, C, K, and V by regression.',
              '_em_single': 'Alternate smoothed sufficient statistics with closed-form maximum-likelihood parameter updates.',
              '_larimore_decomposition': 'Whiten past and future block covariances and SVD their cross-covariance to obtain canonical correlations.',
              '_bauer_scores': 'Evaluate Bauer SVC as omitted canonical energy plus a dimension-dependent finite-sample penalty.',
              '_fit_var_ols': 'Regress current observations on the concatenated lag vector to estimate all VAR coefficient blocks jointly.',
              '_fit_var_morf': 'Apply the Morf/LWR recursion, updating forward and backward prediction errors one lag at a time.',
              '_information_criteria': 'Combine Gaussian residual log-likelihood with AIC, BIC, and HQC parameter penalties.',
              '_score_predictions': 'Evaluate one-step predictions only on temporally later held-out samples.',
              '_evaluate_candidate': 'Fit each candidate on every training window and aggregate held-out predictive loss across folds.',
              'autocovariances': 'Propagate stationary companion covariance to obtain Gamma(k)=E[x_t x_(t-k)^T] for successive lags.',
              'spectral_density': 'Evaluate S(omega)=H(omega) Sigma H(omega)* from transfer function and innovation covariance.',
              'compute_cmem': 'Assemble covariance-memory terms from present covariance, innovations, and lagged Gaussian dependence.',
              'criticality_metrics': 'Convert the dominant eigenvalue modulus into distance to instability and a relaxation timescale.',
          }
          patterns = [
              (r'torch\.linalg\.lstsq\(', 'Solve the linear least-squares problem without forming an explicit normal-equation inverse.'),
              (r'torch\.linalg\.cholesky\(', 'Factor the positive-definite covariance so whitening and solves use stable triangular algebra.'),
              (r'torch\.linalg\.solve_triangular\(', 'Apply the covariance or whitening solve through its triangular Cholesky factor.'),
              (r'torch\.linalg\.solve\(', 'Solve the linear system directly instead of multiplying by an explicit inverse.'),
              (r'torch\.linalg\.svd\(', 'Extract orthogonal latent modes; singular values quantify the variance or canonical dependence retained by each mode.'),
              (r'torch\.linalg\.eigvals\(', 'Obtain dynamical modes whose moduli determine stability and characteristic decay.'),
              (r'torch\.linalg\.eigh\(', 'Diagonalize the symmetric or Hermitian matrix into orthogonal modes and real eigenvalues.'),
              (r'torch\.fft\.', 'Transform the lag-domain quantity into its frequency-domain representation.'),
              (r'logdet_spd\(', 'Turn the Gaussian covariance-volume comparison into an entropy, likelihood, or information term.'),
          ]
          for path in root.rglob('*.py'):
              if path.name in {'__init__.py', '_typing.py', 'adapters.py'}:
                  continue
              text = path.read_text()
              tree = ast.parse(text)
              lines = text.splitlines()
              insert = {}
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in notes:
                      if node.body and isinstance(node.body[0], ast.Expr) and isinstance(node.body[0].value, ast.Constant) and isinstance(node.body[0].value.value, str):
                          line_number = node.body[0].end_lineno
                      else:
                          line_number = node.lineno
                      indent = ' ' * (node.col_offset + 4)
                      insert.setdefault(line_number, []).append(indent + '# ' + notes[node.name])
              expanded = []
              for number, line in enumerate(lines, 1):
                  expanded.append(line)
                  expanded.extend(insert.get(number, []))
              output = []
              for line in expanded:
                  indent = re.match(r'^\s*', line).group(0)
                  for pattern, comment in patterns:
                      if re.search(pattern, line) and not line.lstrip().startswith('#'):
                          if not output or comment not in output[-1]:
                              output.append(indent + '# ' + comment)
                          break
                  output.append(line)
              path.write_text('\n'.join(output) + '\n')
          PY
      - name: Verify comments are behavior-neutral
        run: |
          python -m compileall -q src
          python -m pip install -e '.[dev]'
          pytest -q
      - name: Commit documented source
        run: |
          rm -f .github/internal-comments.patch .github/workflows/export-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/complextorch .github/internal-comments.patch .github/workflows/export-source.yml
          git commit -m 'Document internal mathematical computations'
          git push origin HEAD:docs/internal-math-comments
