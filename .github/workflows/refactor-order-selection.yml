name: refactor-order-selection

on:
  push:
    branches: [refactor/unify-order-selection]
    paths:
      - scripts/fix_order_selection_refactor.py
      - .github/workflows/refactor-order-selection.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unify-order-selection
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply validation fixes
        run: python scripts/fix_order_selection_refactor.py
      - name: Commit repaired source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/complextorch/_state_space_order.py
          git commit -m "Fix internal Bauer helper rename"
          git push origin HEAD:refactor/unify-order-selection
