name: tmp SleepFM context test

on:
  push:
    branches: [tmp-sleepfm-context-test]
  pull_request:
    branches: [main]

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Clone SleepFM
        run: git clone --depth 1 https://github.com/zou-group/sleepfm-clinical.git /tmp/sleepfm-clinical
      - name: Install dependencies
        working-directory: /tmp/sleepfm-clinical
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter nbconvert scikit-learn
      - name: Execute SleepFM demo on CPU
        working-directory: /tmp/sleepfm-clinical
        run: |
          python - <<'PY'
          import nbformat
          p='notebooks/demo.ipynb'
          nb=nbformat.read(p, as_version=4)
          for c in nb.cells:
              if c.cell_type=='code':
                  c.source=c.source.replace('torch.device("cuda")','torch.device("cpu")')
                  c.source=c.source.replace("torch.device('cuda')","torch.device('cpu')")
          nbformat.write(nb, 'notebooks/demo_cpu.ipynb')
          PY
          cd notebooks
          jupyter nbconvert --to notebook --execute demo_cpu.ipynb --output demo_cpu_executed.ipynb --ExecutePreprocessor.timeout=1800
      - name: Compare sequential vs independent epochs
        working-directory: /tmp/sleepfm-clinical
        run: |
          python - <<'PY'
          import os, sys, json
          import numpy as np
          import torch
          from sklearn.metrics import accuracy_score, f1_score, confusion_matrix
          sys.path.insert(0, os.path.join(os.getcwd(),'sleepfm'))
          from models.dataset import SleepEventClassificationDataset, sleep_event_finetune_full_collate_fn
          from models.models import SleepEventLSTMClassifier
          from utils import load_data
          from torch.utils.data import DataLoader

          device=torch.device('cpu')
          cfg=load_data('sleepfm/checkpoints/model_sleep_staging/config.json')
          channel_groups=load_data('sleepfm/configs/channel_groups.json')
          model=SleepEventLSTMClassifier(**cfg['model_params']).to(device)
          ckpt=torch.load('sleepfm/checkpoints/model_sleep_staging/best.pth', map_location='cpu')
          if all(k.startswith('module.') for k in ckpt.keys()):
              ckpt={k[7:]:v for k,v in ckpt.items()}
          model.load_state_dict(ckpt)
          model.eval()

          h5='notebooks/demo_data/demo_emb/demo_psg.hdf5'
          lab='notebooks/demo_data/demo_psg.csv'
          ds=SleepEventClassificationDataset(cfg, channel_groups, [h5], [lab], split='test')
          dl=DataLoader(ds,batch_size=1,shuffle=False,num_workers=0,collate_fn=sleep_event_finetune_full_collate_fn)
          x,y,mask,paths=next(iter(dl))
          x=x.to(device); mask=mask.to(device)
          with torch.no_grad():
              logits_seq, outmask=model(x,mask)
              probs_seq=torch.softmax(logits_seq,dim=-1)
              probs_ind=[]
              for t in range(x.shape[2]):
                  lt,_=model(x[:,:,t:t+1,:], mask[:,:,t:t+1])
                  probs_ind.append(torch.softmax(lt,dim=-1))
              probs_ind=torch.cat(probs_ind,dim=1)

          valid=(outmask[0]==0).cpu().numpy().astype(bool)
          yy=y[0].cpu().numpy().astype(int)[valid]
          ps=probs_seq[0].cpu().numpy()[valid]
          pi=probs_ind[0].cpu().numpy()[valid]
          pred_s=ps.argmax(1); pred_i=pi.argmax(1)
          metrics={
             'n_valid': int(valid.sum()),
             'agreement': float(np.mean(pred_s==pred_i)),
             'changed_fraction': float(np.mean(pred_s!=pred_i)),
             'mean_abs_prob_diff': float(np.mean(np.abs(ps-pi))),
             'median_abs_prob_diff': float(np.median(np.abs(ps-pi))),
             'max_abs_prob_diff': float(np.max(np.abs(ps-pi))),
             'mean_l1_per_epoch': float(np.mean(np.sum(np.abs(ps-pi),axis=1))),
             'sequential_accuracy': float(accuracy_score(yy,pred_s)),
             'independent_accuracy': float(accuracy_score(yy,pred_i)),
             'sequential_macro_f1': float(f1_score(yy,pred_s,average='macro',zero_division=0)),
             'independent_macro_f1': float(f1_score(yy,pred_i,average='macro',zero_division=0)),
             'sequential_mean_confidence': float(ps.max(1).mean()),
             'independent_mean_confidence': float(pi.max(1).mean()),
             'seq_stage_counts': np.bincount(pred_s,minlength=5).tolist(),
             'ind_stage_counts': np.bincount(pred_i,minlength=5).tolist(),
             'target_stage_counts': np.bincount(yy,minlength=5).tolist(),
             'seq_confusion': confusion_matrix(yy,pred_s,labels=range(5)).tolist(),
             'ind_confusion': confusion_matrix(yy,pred_i,labels=range(5)).tolist(),
          }
          print('SLEEPFM_CONTEXT_RESULTS='+json.dumps(metrics,sort_keys=True))
          np.save('/tmp/probs_sequential.npy',ps)
          np.save('/tmp/probs_independent.npy',pi)
          np.save('/tmp/targets.npy',yy)
          with open('/tmp/metrics.json','w') as f: json.dump(metrics,f,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sleepfm-context-results
          path: |
            /tmp/probs_sequential.npy
            /tmp/probs_independent.npy
            /tmp/targets.npy
            /tmp/metrics.json
