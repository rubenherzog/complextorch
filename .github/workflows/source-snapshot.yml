name: Source snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: source-snapshot-main
  cancel-in-progress: true

jobs:
  snapshot:
    name: Publish current main snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage source snapshot
        shell: bash
        run: |
          snapshot_dir="$RUNNER_TEMP/complextorch-source"
          mkdir -p "$snapshot_dir"
          rsync -a \
            --exclude='.git/' \
            --exclude='docs/_build/' \
            ./ "$snapshot_dir/"

          printf '%s\n' \
            '{' \
            '  "repository": "${{ github.repository }}",' \
            '  "branch": "main",' \
            '  "commit": "${{ github.sha }}",' \
            '  "created_at": "${{ github.event.head_commit.timestamp }}"' \
            '}' \
            > "$snapshot_dir/.snapshot.json"

      - name: Upload source snapshot
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: complextorch-source
          path: ${{ runner.temp }}/complextorch-source/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

      - name: Remove previous snapshots
        uses: actions/github-script@v7
        env:
          CURRENT_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        with:
          script: |
            const currentId = Number(process.env.CURRENT_ARTIFACT_ID);
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'complextorch-source',
              per_page: 100,
            });
            for (const artifact of data.artifacts) {
              if (artifact.id !== currentId) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Publish artifact pointer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=source-snapshot \
            -f description="Current source snapshot" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${ARTIFACT_ID}"
