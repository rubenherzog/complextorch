name: Source snapshot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  statuses: write

concurrency:
  group: source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Publish current source snapshot
    runs-on: ubuntu-latest
    env:
      SNAPSHOT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SNAPSHOT_SHA }}

      - name: Stage source snapshot
        shell: bash
        run: |
          snapshot_dir="$RUNNER_TEMP/complextorch-source"
          mkdir -p "$snapshot_dir"
          rsync -a \
            --exclude='.git/' \
            --exclude='docs/_build/' \
            ./ "$snapshot_dir/"

          printf '%s\n' \
            '{' \
            '  "repository": "${{ github.repository }}",' \
            '  "branch": "${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}",' \
            '  "commit": "${{ env.SNAPSHOT_SHA }}",' \
            '  "created_at": "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.updated_at || github.event.head_commit.timestamp }}"' \
            '}' \
            > "$snapshot_dir/.snapshot.json"

      - name: Upload source snapshot
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: complextorch-source
          path: ${{ runner.temp }}/complextorch-source/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

      - name: Publish artifact pointer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${SNAPSHOT_SHA}" \
            -f state=success \
            -f context=source-snapshot \
            -f description="Current source snapshot" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${ARTIFACT_ID}"

      - name: Remove legacy release snapshot
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete current-source --cleanup-tag --yes || true
