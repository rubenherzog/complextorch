name: Source snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: source-snapshot-main
  cancel-in-progress: true

jobs:
  snapshot:
    name: Publish current main snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build source snapshot
        shell: bash
        run: |
          snapshot_dir="$RUNNER_TEMP/complextorch-source"
          archive="$RUNNER_TEMP/complextorch-source.zip"

          mkdir -p "$snapshot_dir"
          rsync -a \
            --exclude='.git/' \
            --exclude='docs/_build/' \
            ./ "$snapshot_dir/"

          printf '%s\n' \
            '{' \
            '  "repository": "${{ github.repository }}",' \
            '  "branch": "main",' \
            '  "commit": "${{ github.sha }}",' \
            '  "created_at": "${{ github.event.head_commit.timestamp }}"' \
            '}' \
            > "$snapshot_dir/.snapshot.json"

          cd "$RUNNER_TEMP"
          zip -qr "$archive" complextorch-source

      - name: Publish stable release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f current-source "$GITHUB_SHA"
          git push origin refs/tags/current-source --force

          if ! gh release view current-source >/dev/null 2>&1; then
            gh release create current-source \
              --title "Current source snapshot" \
              --notes "Machine-readable snapshot of the current main branch for agent-side local execution." \
              --prerelease
          fi

          gh release upload current-source \
            "$RUNNER_TEMP/complextorch-source.zip" \
            --clobber
